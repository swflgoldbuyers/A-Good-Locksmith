<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none" aria-hidden="true">
  <g fill="#ffffff" opacity="1">
    <!-- padlock -->
    <g transform="translate(140,120)">
      <rect x="16" y="36" width="48" height="40" rx="5"/>
      <path d="M26 36v-12a14 14 0 0 1 28 0v12" fill="none" stroke="#fff" stroke-width="3.5"/>
      <circle cx="40" cy="56" r="3.5"/>
    </g>
    <!-- key -->
    <g transform="translate(980,150) rotate(16)">
      <circle cx="14" cy="18" r="10"/>
      <circle cx="14" cy="18" r="3.5" fill="#111"/>
      <rect x="22" y="15" width="46" height="6" rx="1.5"/>
      <rect x="56" y="11" width="3" height="14"/><rect x="63" y="11" width="3" height="14"/>
    </g>
    <!-- cylinder / keyway -->
    <g transform="translate(560,160)">
      <ellipse cx="30" cy="30" rx="26" ry="26" fill="none" stroke="#fff" stroke-width="2.5"/>
      <ellipse cx="30" cy="30" rx="14" ry="14" fill="none" stroke="#fff" stroke-width="1.5"/>
      <rect x="27" y="30" width="6" height="34" rx="1"/>
    </g>
    <!-- key blank -->
    <g transform="translate(220,540) rotate(-14)">
      <circle cx="12" cy="16" r="9"/>
      <rect x="18" y="13" width="54" height="6" rx="1"/>
      <path d="M40 19v8M48 19v10M56 19v7" stroke="#fff" stroke-width="2"/>
    </g>
    <!-- mechanism pins hint -->
    <g transform="translate(860,500)">
      <rect x="10" y="10" width="70" height="28" rx="4" fill="none" stroke="#fff" stroke-width="2"/>
      <rect x="22" y="4" width="6" height="16" rx="1"/><rect x="36" y="0" width="6" height="20" rx="1"/><rect x="50" y="6" width="6" height="14" rx="1"/><rect x="64" y="2" width="6" height="18" rx="1"/>
    </g>
    <!-- small lock -->
    <g transform="translate(640,620) scale(0.85)">
      <rect x="16" y="34" width="40" height="34" rx="4"/>
      <path d="M24 34v-10a12 12 0 0 1 24 0v10" fill="none" stroke="#fff" stroke-width="3"/>
      <circle cx="36" cy="52" r="3"/>
    </g>
    <!-- another key -->
    <g transform="translate(420,120) rotate(8) scale(0.8)">
      <circle cx="14" cy="18" r="10"/>
      <rect x="22" y="15" width="50" height="6" rx="1"/>
      <rect x="60" y="12" width="3" height="12"/><rect x="67" y="12" width="3" height="12"/><rect x="74" y="12" width="3" height="12"/>
    </g>
  </g>
</svg>
